<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Comidas Huetamo</title>
<link rel="stylesheet" href="style.css">

<style>
body{
margin:0;
}

/* ===== BANNER ===== */
.banner{
position:relative;
width:100%;
height:100vh;
overflow:hidden;
}

.banner img{
width:100%;
height:100%;
object-fit:cover;
filter: brightness(0.7); /* 🔥 efecto oscuro */
}

/* ===== CONTENIDO ===== */
.contenido{
position:absolute;
bottom:40px;
left:50%;
transform:translateX(-50%);
text-align:center;
width:100%;
}

/* ===== BOTON PRINCIPAL ===== */
.btn-main{
padding:14px 30px;
border-radius:25px;
border:none;
cursor:pointer;
background: linear-gradient(135deg,#ff6d00,#ff3d00);
color:white;
font-size:16px;
font-weight:bold;
box-shadow:0 5px 20px rgba(0,0,0,0.4);
transition:0.3s;
}

.btn-main:hover{
transform:scale(1.05);
}

/* ===== TEXTO ===== */
.titulo-home{
position:absolute;
top:30%;
left:50%;
transform:translateX(-50%);
color:white;
font-size:32px;
font-weight:bold;
text-shadow:0 3px 10px rgba(0,0,0,0.6);
}
</style>
</head>

<body>

<!-- 🔥 LOADER -->
<div id="loader" class="loader">Cargando...</div>

<a href="admin-login.html" class="btn-admin">⚙️</a>

<!-- BANNER -->
<div class="banner">

<img src="img/Huetamo.png" alt="Comida">

<h1 class="titulo-home">Comidas Huetamo</h1>

<div class="contenido">
<button onclick="location.href='buscador.html'" class="btn-main">
Entrar
</button>
</div>

</div>

<a href="registro.html" class="btn-float">+</a>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="script.js"></script>

</body>
</html>
